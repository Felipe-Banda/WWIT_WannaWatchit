version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      # Mapeia a pasta atual para garantir que o SQLite seja persistente
      - .:/app 

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8501:8501"
    environment:
      # Conecta o Streamlit ao contêiner da API
      - API_URL=http://api:8000
    depends_on:
      - api